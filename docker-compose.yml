services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delorean-app
    ports:
      - "6543:6543"
    volumes:
      - .:/app
    env_file:
      - .env
    working_dir: /app
    user: "65534:65534"
    command: pserve development.ini --reload

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delorean-test
    volumes:
      - .:/app
    env_file:
      - .env
    working_dir: /app
    user: "65534:65534"
    command: python -m pytest -q delorean/tests.py
    profiles:
      - test
